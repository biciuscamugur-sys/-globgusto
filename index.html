
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraAtlas 3.5 - Explorator Global</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #001f3f;
            color: #FFD700;
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 3.5rem;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
            margin-bottom: 10px;
        }
        .info {
            font-size: 1.3rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 500px;
            width: 100%;
        }
        button {
            padding: 16px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            background-color: #2E8B57;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        button:hover {
            transform: scale(1.05);
            background-color: #3CB371;
            box-shadow: 0 6px 14px rgba(0,0,0,0.4);
        }
        button:active {
            transform: scale(0.95);
        }
        .status {
            margin-top: 30px;
            font-size: 1.2rem;
            background: rgba(255,255,255,0.05);
            padding: 15px 30px;
            border-radius: 30px;
            border: 1px solid rgba(255,215,0,0.2);
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 600px;
            width: 100%;
        }
        .region-display {
            font-size: 2.5rem;
            margin: 0 10px;
        }
    </style>
</head>
<body>

    <h1>🌍 TerraAtlas 3.5</h1>
    <div class="info">Descoperă lumea cu un simplu click!</div>

    <div class="controls">
        <button id="exploreBtn">🗺️ Random Explore</button>
        <button id="resetBtn">🔄 Globe Reset</button>
        <button id="windBtn">💨 Wind Visualization</button>
        <button id="daynightBtn">🌓 Day/Night Mode</button>
    </div>

    <div class="status" id="statusMessage">
        <span>🌐</span>
        <span id="regionText">Așteaptă comenzi...</span>
    </div>

    <script>
        // Lista de regiuni/țări pentru explorare
        const regions = [
            { name: '🏔️ Himalaya', desc: 'Cel mai înalt lanț muntos din lume' },
            { name: '🏜️ Sahara', desc: 'Cel mai mare deșert cald' },
            { name: '🌿 Amazon', desc: 'Cea mai mare pădure tropicală' },
            { name: '🏝️ Maldive', desc: 'Paradis tropical în Oceanul Indian' },
            { name: '🗿 Machu Picchu', desc: 'Orașul pierdut al incașilor' },
            { name: '🏛️ Roma', desc: 'Orașul etern, inima Imperiului Roman' },
            { name: '🗼 Tokyo', desc: 'Metropola futuristă a Japoniei' },
            { name: '🏜️ Petra', desc: 'Orașul de piatră din Iordania' },
            { name: '⛰️ Alpi', desc: 'Cel mai faimos lanț muntos european' },
            { name: '🏝️ Bora Bora', desc: 'Perla Pacificului de Sud' },
            { name: '🏯 Kyoto', desc: 'Capitala spirituală a Japoniei' },
            { name: '🌋 Islanda', desc: 'Țara ghețarilor și vulcanilor' },
            { name: '🏞️ Yosemite', desc: 'Parcul național al stâncilor de granit' },
            { name: '🏝️ Santorini', desc: 'Insula cu case albe și apă albastră' },
            { name: '🗿 Moai', desc: 'Statui uriașe din Insula Paștelui' }
        ];

        const statusEl = document.getElementById('statusMessage');
        const regionTextEl = document.getElementById('regionText');

        function showRegion(region) {
            regionTextEl.innerHTML = `<span class="region-display">${region.name}</span><br><span style="font-size:0.8rem;opacity:0.8;">${region.desc}</span>`;
            statusEl.style.borderColor = '#FFD700';
            statusEl.style.background = 'rgba(255,215,0,0.05)';
        }

        function showMessage(text, emoji = '✅') {
            regionTextEl.innerHTML = `${emoji} ${text}`;
            statusEl.style.borderColor = 'rgba(255,215,0,0.2)';
            statusEl.style.background = 'rgba(255,255,255,0.05)';
        }

        document.getElementById('exploreBtn').addEventListener('click', function() {
            const randomIndex = Math.floor(Math.random() * regions.length);
            const region = regions[randomIndex];
            showRegion(region);
            console.log(`🌍 Explorare: ${region.name} - ${region.desc}`);
        });

        document.getElementById('resetBtn').addEventListener('click', function() {
            showMessage('🌐 Sistem resetat. Așteaptă comenzi...');
            console.log('🔄 Sistem resetat');
        });

        document.getElementById('windBtn').addEventListener('click', function() {
            showMessage('💨 Vânt: Activare fluxuri atmosferice...');
            console.log('💨 Wind Visualization activat');
        });

        document.getElementById('daynightBtn').addEventListener('click', function() {
            showMessage('🌓 Mod Zi/Noapte: Comutare dinamică...');
            console.log('🌓 Day/Night Mode activat');
        });

        console.log('✅ TerraAtlas 3.5 a pornit cu succes!');
        console.log(`📋 ${regions.length} regiuni încărcate pentru explorare.`);
    </script>

</body>
</html>
